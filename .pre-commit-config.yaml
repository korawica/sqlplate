default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
    python: python3.10

repos:
-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    -   id: black
        stages: [pre-commit]
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev:  v0.4.2
    hooks:
    -   id: ruff
        args: ["--fix"]
        stages: [pre-commit]
-   repo: https://github.com/korawica/clishelf
    rev: v0.2.19
    hooks:
    -   id: shelf-commit-msg
